# ============================================================================
# dbt Profile — NusaCode DE Beginner (ClickHouse)
# ============================================================================
# Nilai kredensial diambil dari environment variable.
# Setup: cp .env.example .env lalu isi sesuai ClickHouse lokal Anda.
#
# Required adapter:
#   pip install dbt-core dbt-clickhouse
# ============================================================================

nusacode_de:
  target: dev
  outputs:
    dev:
      type: clickhouse

      # === Koneksi ke ClickHouse lokal (dari env) ===
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT') | int }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      schema: "{{ env_var('DBT_SCHEMA') }}"
      # secure: "{{ env_var('DBT_SECURE', 'false') == 'true' }}"

      # === Connection Settings ===
      threads: "{{ env_var('DBT_THREADS') | int }}"
      connect_timeout: "{{ env_var('DBT_CONNECT_TIMEOUT') | int }}"
      retries: 1