# ============================================================================
# NusaCode DE Beginner — dbt Project Configuration
# ============================================================================
# Ditujukan untuk pembelajaran sesi 5-6.
# Menggunakan profile "dw_nusacode" (PostgreSQL lokal via Docker).

name: 'nusacode_de'
version: '1.0.0'
config-version: 2
profile: nusacode_de

# Jalur direktori dalam proyek dbt
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"      # Direktori hasil kompilasi (di-gitignore)
clean-targets:
  - "target"
  - "dbt_packages"

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
models:
  nusacode_de:
    # Konfigurasi default untuk semua model
    +materialized: view

    staging:
      # Staging models: materialized sebagai VIEW agar ringan
      +materialized: view

    intermediate:
      # Intermediate models: VIEW untuk logika bisnis di antaranya
      +materialized: view

    marts:
      # Marts models: TABLE agar query cepat ketika diakses BI tools
      +materialized: table